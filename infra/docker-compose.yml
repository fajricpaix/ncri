services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ncri
      POSTGRES_PASSWORD: ncri_dev_password
      POSTGRES_DB: ncri
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncri"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
