name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: ncri, POSTGRES_PASSWORD: ncri_dev_password, POSTGRES_DB: ncri }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ncri" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: services/api/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -q
      # migrasi dari database kosong + seed harus selalu jalan (bukan hanya inkremental di laptop)
      - run: alembic upgrade head
      - run: python -m app.seed

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
